[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pactown"
version = "0.1.173"
description = "Pactown Ecosystem Orchestrator - Build and manage decentralized microservice ecosystems from Markdown READMEs using markpact sandboxes and a centralized service registry."
readme = "README.md"
authors = [{ name = "Tom Sapletta", email = "tom@sapletta.com" }]
keywords = ["markpact", "microservices", "decentralized", "ecosystem", "orchestrator", "markdown", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
]
requires-python = ">=3.10"
dependencies = [
    "markpact>=0.1.18",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
    "pydantic>=2.0",
    "watchfiles>=0.20.0",
    "python-dotenv>=1.0",
    "nfo>=0.1.17",
]

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "pytest-cov>=4.0",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.1",
    "build",
    "twine",
    "bump2version>=1.0",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
]
security = [
    "bandit>=1.7",
    "pip-audit>=2.6",
    "safety>=2.3",
    "semgrep>=1.50",
]
llm = [
    "lolm>=0.1.6",
]
all = [
    "lolm>=0.1.6",
]

[project.scripts]
pactown = "pactown.cli:main"
pactown-registry = "pactown.registry.server:main"
pactown-quadlet-api = "pactown.deploy.quadlet_api:run_api"
pactown-runner-api = "pactown.runner_api:main"

[project.urls]
Homepage = "https://github.com/wronai/pactown"
Repository = "https://github.com/wronai/pactown"
Issues = "https://github.com/wronai/pactown/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pactown"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p anyio -p pytest_asyncio.plugin -p no:pytest_aiohttp -p no:aiohttp.pytest_plugin"

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
